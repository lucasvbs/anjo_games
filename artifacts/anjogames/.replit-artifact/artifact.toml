kind = "web"
previewPath = "/"
title = "AnjoGames"
description = "Site institucional da associação AnjoGames com projetos, galeria e transparência financeira."
version = "1.0.0"
id = "artifacts/anjogames"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24395

[services.development]
run = "pnpm --filter @workspace/anjogames run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anjogames", "run", "build" ]
serve = "static"
publicDir = "artifacts/anjogames/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24395"
BASE_PATH = "/"
